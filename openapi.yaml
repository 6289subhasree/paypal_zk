components:
  schemas:
    AuthorizeIn:
      properties:
        proof:
          title: Proof
          type: object
        public_signals:
          items:
            type: string
          maxItems: 9
          minItems: 9
          title: Public Signals
          type: array
      required:
      - proof
      - public_signals
      title: AuthorizeIn
      type: object
    Body_upload_document_api_kyc_sessions__session_id__documents_post:
      properties:
        file:
          format: binary
          title: File
          type: string
      required:
      - file
      title: Body_upload_document_api_kyc_sessions__session_id__documents_post
      type: object
    ChatIn:
      properties:
        message:
          anyOf:
          - maxLength: 1000
            type: string
          - type: 'null'
          title: Message
        step:
          default: welcome
          pattern: ^(welcome|details|document|liveness|submit)$
          title: Step
          type: string
      title: ChatIn
      type: object
    ClaimIn:
      properties:
        paypal_email:
          format: email
          title: Paypal Email
          type: string
        proof:
          title: Proof
          type: object
        public_signals:
          items:
            type: string
          maxItems: 9
          minItems: 9
          title: Public Signals
          type: array
      required:
      - proof
      - public_signals
      - paypal_email
      title: ClaimIn
      type: object
    CreateOrderIn:
      properties:
        payment_request_id:
          title: Payment Request Id
          type: string
        save_wallet:
          default: false
          title: Save Wallet
          type: boolean
      required:
      - payment_request_id
      title: CreateOrderIn
      type: object
    CreatePayoutIn:
      properties:
        amount:
          anyOf:
          - exclusiveMinimum: 0.0
            maximum: 5000.0
            type: number
          - type: string
          title: Amount
        currency:
          default: USD
          pattern: ^[A-Z]{3}$
          title: Currency
          type: string
        min_age:
          default: 0
          maximum: 99.0
          minimum: 0.0
          title: Min Age
          type: integer
        note:
          default: ''
          maxLength: 200
          title: Note
          type: string
      required:
      - amount
      title: CreatePayoutIn
      type: object
    CreateRequestIn:
      properties:
        amount:
          anyOf:
          - exclusiveMinimum: 0.0
            maximum: 10000.0
            type: number
          - type: string
          title: Amount
        currency:
          default: USD
          pattern: ^[A-Z]{3}$
          title: Currency
          type: string
        description:
          default: ''
          maxLength: 200
          title: Description
          type: string
        min_age:
          default: 0
          maximum: 99.0
          minimum: 0.0
          title: Min Age
          type: integer
      required:
      - amount
      title: CreateRequestIn
      type: object
    DecisionIn:
      properties:
        decision:
          pattern: ^(approved|rejected|needs_review)$
          title: Decision
          type: string
        reason_code:
          default: reviewer_decision
          maxLength: 60
          title: Reason Code
          type: string
      required:
      - decision
      title: DecisionIn
      type: object
    DetailsIn:
      properties:
        date_of_birth:
          format: date
          title: Date Of Birth
          type: string
        full_name:
          maxLength: 120
          minLength: 2
          title: Full Name
          type: string
      required:
      - full_name
      - date_of_birth
      title: DetailsIn
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    IssueIn:
      properties:
        holder_commitment:
          pattern: ^[0-9]{1,78}$
          title: Holder Commitment
          type: string
      required:
      - holder_commitment
      title: IssueIn
      type: object
    LivenessIn:
      properties:
        challenges:
          items:
            enum:
            - blink
            - turn_left
            - turn_right
            type: string
          maxItems: 6
          title: Challenges
          type: array
        duration_ms:
          anyOf:
          - maximum: 600000.0
            minimum: 0.0
            type: integer
          - type: 'null'
          title: Duration Ms
        method:
          default: simulated
          enum:
          - simulated
          - on_device
          title: Method
          type: string
      title: LivenessIn
      type: object
    LoginIn:
      properties:
        email:
          format: email
          title: Email
          type: string
        password:
          title: Password
          type: string
      required:
      - email
      - password
      title: LoginIn
      type: object
    RegisterIn:
      properties:
        display_name:
          maxLength: 120
          minLength: 1
          title: Display Name
          type: string
        email:
          format: email
          title: Email
          type: string
        password:
          maxLength: 128
          minLength: 8
          title: Password
          type: string
      required:
      - email
      - password
      - display_name
      title: RegisterIn
      type: object
    StartIn:
      properties:
        consent:
          title: Consent
          type: boolean
      required:
      - consent
      title: StartIn
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    VaultedPayIn:
      properties:
        payment_request_id:
          title: Payment Request Id
          type: string
      required:
      - payment_request_id
      title: VaultedPayIn
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
